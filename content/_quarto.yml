project:
  type: website
  output-dir: docs
  render:
  - '*.qmd'
  resources:
  - images/**
website:
  title: Baltic Sea
  description: 'Summary Report of Baltic Sea In Situ Observations

    '
  navbar:
    logo: images/logo.png
    logo-href: https://aiqc-hub.github.io/aiqc-report/
    logo-alt: "AIQC"
    # Quarto folds the site title into the same brand link as the logo, so with
    # logo-href set the title pointed at the portal too and nothing led home.
    # Distill kept them apart: logo -> portal, title -> index. Suppress the
    # brand title and put it back as an ordinary left-hand nav item.
    title: false
    left:
    - text: "Baltic Sea"
      href: index.qmd
    tools:
    - icon: github
      href: https://github.com/AIQC-Hub/bal-report
      text: "Source on GitHub"
    right:
    - text: Profile Summary
      menu:
      - text: Summary (BO)
        href: bo_summary.qmd
      - text: Summary (CORA)
        href: bo_cora_summary.qmd
    - text: Temperature
      menu:
      - text: Temp (BO)
        href: bo_temp.qmd
      - text: Temp (CORA)
        href: bo_cora_temp.qmd
      - text: '---'
      - text: Temp QC (BO)
        href: bo_temp_qc.qmd
      - text: Temp QC (CORA)
        href: bo_cora_temp_qc.qmd
    - text: Salinity
      menu:
      - text: Psal (BO)
        href: bo_psal.qmd
      - text: Psal (CORA)
        href: bo_cora_psal.qmd
      - text: '---'
      - text: Psal QC (BO)
        href: bo_psal_qc.qmd
      - text: Psal QC (CORA)
        href: bo_cora_psal_qc.qmd
format:
  html:
    toc: true
    toc-depth: 2
